[project]
name = "content-agent-interview"
version = "0.1.0"
description = "A modular live-stream sales assistant agent prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiohttp~=3.9.0",
    "Brotli~=1.1.0",
    "pure-protobuf~=3.1.2",
    "yarl~=1.9.3",
]

[project.scripts]
content-agent = "content_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_agent", "src/blivedm"]

[tool.ruff]
line-length = 100
